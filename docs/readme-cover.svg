<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title description">
  <title id="title">Corso Velle — The storefront, considered.</title>
  <desc id="description">An editorial cream wordmark on warm espresso, with a slowly moving copper light and fine orbit lines. Native Shopify, thoughtfully crafted.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#211b18"/>
      <stop offset="1" stop-color="#3b2c24"/>
    </linearGradient>
    <radialGradient id="light">
      <stop stop-color="#ce946c" stop-opacity=".24"/>
      <stop offset="1" stop-color="#ce946c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="thread">
      <stop stop-color="#b88865" stop-opacity="0"/>
      <stop offset=".5" stop-color="#e6b18a"/>
      <stop offset="1" stop-color="#b88865" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="edge"><rect width="1200" height="400" rx="12"/></clipPath>
  </defs>
  <style>
    .glow { animation: drift 14s ease-in-out infinite alternate; }
    .orbit { transform-origin: 1060px 195px; animation: orbit 40s linear infinite; }
    .thread { animation: thread 7s ease-in-out infinite; }
    @keyframes drift { from { transform: translateX(-100px); } to { transform: translateX(100px); } }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes thread { 0%,100% { transform: translateX(-160px); opacity: .35; } 50% { transform: translateX(160px); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .glow, .orbit, .thread { animation: none; } }
  </style>
  <g clip-path="url(#edge)">
    <rect width="1200" height="400" fill="url(#background)"/>
    <ellipse class="glow" cx="870" cy="190" rx="390" ry="330" fill="url(#light)"/>
    <g class="orbit" fill="none" stroke="#cfac88" stroke-opacity=".16">
      <ellipse cx="1060" cy="195" rx="190" ry="270" transform="rotate(28 1060 195)"/>
      <ellipse cx="1060" cy="195" rx="190" ry="270" transform="rotate(70 1060 195)"/>
      <circle cx="1060" cy="195" r="222"/>
    </g>
    <path d="M48 66H1152M48 330H1152" stroke="#e7d6bf" stroke-opacity=".18"/>
    <path class="thread" d="M300 330H900" stroke="url(#thread)" stroke-width="2"/>
    <g fill="#f4ead9" font-family="Arial, Helvetica, sans-serif">
      <text x="50" y="44" font-size="11" letter-spacing="4">THE STOREFRONT, CONSIDERED.</text>
      <text x="1150" y="44" text-anchor="end" font-size="11" letter-spacing="3" fill="#cfac88">C / V</text>
      <text x="46" y="211" font-family="Georgia, 'Times New Roman', serif" font-size="100" letter-spacing="3">CORSO VELLE</text>
      <text x="51" y="260" font-size="16" letter-spacing="1.5" fill="#d4c1ac">Timeless essentials. Thoughtfully crafted commerce.</text>
      <text x="50" y="364" font-size="11" letter-spacing="2.4">LIQUID / TYPESCRIPT / VITE</text>
      <text x="1150" y="364" text-anchor="end" font-size="11" letter-spacing="2.4" fill="#cfac88">NATIVE SHOPIFY · OS 2.0</text>
    </g>
  </g>
</svg>
